baseURL: 'https://xezpeleta.github.io/'
title: Xabi Ezpeleta
copyright: 'Copyright © Xabier Ezpeleta. License [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/).'
theme: PaperMod

# Replacing deprecated 'paginate' with new 'pagination.pagerSize'
pagination:
  pagerSize: 5
pluralizeListTitles: false
enableRobotsTXT: true

params:
  author: Xabi Ezpeleta

  # Sare sozialetan partekatzean erabiltzen den irudi lehenetsia (cover gabeko orrietan)
  images:
    - images/og-default.png

  # Azal-irudiak ez erakutsi webgunean (sare sozialetan erabiltzen jarraitzen dira)
  cover:
    hidden: true

  hideAuthor: true
  ShowToc: true
  TocOpen: false

  ShowCodeCopyButtons: true
  
  # Ikonoak agertzeko, homeInfoParams gehitu behar dut
  # Hutsik uzten badut, margen bat gehitzen dit 320px-koa
  # post-entry.css fitxategian bilatu eta komentatu dut
  homeInfoParams:
    Title:
    Content:

  socialIcons:
  - name: mastodon
    url: "https://mastodon.eus/@xezpeleta"
  - name: github
    url: "https://github.com/xezpeleta"

services:
  googleAnalytics:
    id: G-ZJRN8P7X6R

#menu:
#  main:
#    - identifier: categories
#      name: categories
#      url: /categories/
#      weight: 10
#    - identifier: tags
#      name: tags
#      url: /tags/
#      weight: 20

defaultContentLanguage: eu
languages:
  eu:
    label: 'Euskara'
    locale: eu-ES
    weight: 1
    params:
      description: 'Xabi Ezpeletaren bloga: euskara, adimen artifiziala eta software librea.'
    cascade:
      params:
        locale: eu_ES
    menu:
      main:
        - name: kategoriak
          url: categories/
          weight: 10
        - name: etiketak
          url: tags/
          weight: 20
  en:
    label: 'English'
    locale: en-US
    weight: 2
    params:
      description: "Xabi Ezpeleta's blog: Basque language, artificial intelligence and free software."
    cascade:
      params:
        locale: en_US
    menu:
      main:
        - name: categories
          url: categories/
          weight: 10
        - name: tags
          url: tags/
          weight: 20
